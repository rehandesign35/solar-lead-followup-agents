  <style>
    :root{color-scheme:dark;--bg:#0b0e12;--panel:#11161d;--panel2:#171d26;--line:#29323e;--ink:#f4f7fb;--muted:#95a1b1;--faint:#667384;--accent:#f6b84b;--green:#55d69b;--blue:#70a8ff;--violet:#b799ff;--red:#ff7d79;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(112,168,255,.09),transparent 30rem),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit}button{font:inherit;touch-action:manipulation}.topbar{height:68px;padding:14px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(246,184,75,.45);border-radius:9px;color:var(--accent);background:rgba(246,184,75,.1);font-size:18px}.brand strong{display:block;font-size:14px}.brand small{display:block;margin-top:2px;color:var(--faint);font:11px var(--mono)}.back{color:var(--muted);text-decoration:none;font-size:12px;padding:9px 11px;border-radius:7px}.back:hover{color:var(--ink);background:var(--panel2)}.wrap{width:min(860px,100%);margin:0 auto;padding:42px clamp(18px,4vw,32px) 76px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{color:var(--accent);font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.header h1{margin:9px 0 7px;font-size:clamp(25px,4vw,38px);letter-spacing:-.045em;line-height:1.04;text-wrap:balance}.header p{margin:0;color:var(--muted);font:12px var(--mono)}.status{padding:7px 10px;border:1px solid rgba(255,125,121,.35);border-radius:999px;color:var(--red);background:rgba(255,125,121,.08);font:600 10px var(--mono);white-space:nowrap}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:27px}.legend{display:flex;flex-wrap:wrap;gap:8px;flex:1}.legend-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--muted);font:10px var(--mono)}.dot{width:7px;height:7px;border-radius:50%}.raw-toggle{min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:7px;color:var(--muted);background:transparent;cursor:pointer;font:10px var(--mono)}.raw-toggle:hover{color:var(--ink);border-color:var(--faint)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#raw-panel{display:none;margin-bottom:27px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#090b0f;overflow:auto}#raw-panel.open{display:block}#raw-panel pre{margin:0;color:#a9e6c1;font:11px/1.6 var(--mono);white-space:pre}.timeline{position:relative}.day-divider{display:flex;align-items:center;gap:12px;margin:28px 0 17px}.day-divider:first-child{margin-top:0}.day-divider .line{height:1px;flex:1;background:var(--line)}.day-divider .label{color:var(--faint);font:10px var(--mono);white-space:nowrap}.row{display:grid;grid-template-columns:18px minmax(0,1fr);gap:14px;animation:rise .3s ease both}.spine{position:relative;display:flex;justify-content:center}.spine:before{content:"";position:absolute;top:0;bottom:-18px;width:1px;background:var(--seg-color,var(--line));opacity:.6}.row:last-child .spine:before{display:none}.node{z-index:1;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--seg-color,var(--faint));box-shadow:0 0 0 4px var(--bg)}.routing-line{padding:2px 0 18px;color:var(--muted);font:11px/1.55 var(--mono);overflow-wrap:anywhere}.routing-line .arrow{color:var(--seg-color);font-weight:700}.routing-line .reason{color:var(--faint)}.card{margin-bottom:18px;padding:13px 15px;border:1px solid var(--line);border-left:3px solid var(--seg-color,var(--line));border-radius:9px;background:var(--panel)}.card.lead{background:var(--panel2);border-left-color:#718096}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:7px}.agent-tag{color:var(--seg-color,var(--muted));font:600 10px var(--mono);letter-spacing:.08em}.timestamp{color:var(--faint);font:10px var(--mono);white-space:nowrap}.card p{margin:0;color:var(--ink);font-size:14px;line-height:1.52;overflow-wrap:anywhere}.card.escalated{background:rgba(255,125,121,.07);border-left-color:var(--red)}.card.escalated .agent-tag,.review-chip{color:var(--red)}.review-chip{display:inline-block;margin-top:10px;padding:4px 7px;border:1px solid rgba(255,125,121,.3);border-radius:5px;background:rgba(255,125,121,.1);font:10px var(--mono)}footer{margin-top:31px;padding-top:15px;border-top:1px solid var(--line);color:var(--faint);font:11px/1.5 var(--mono)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:620px){.header{display:block}.status{display:inline-block;margin-top:17px}.toolbar{display:block}.legend{margin-bottom:10px}.raw-toggle{width:100%;height:36px}.wrap{padding-top:30px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>

<body><header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">☼</div><div><strong>Sunshine Solar</strong><small>LEAD OPERATIONS / TRACE VIEW</small></div></div><a class="back" href="index.html">Back to workspace</a></header>
  <main class="wrap"><div class="header"><div><span class="eyebrow">Conversation history / lead #4821</span><h1>Agent trace</h1><p>Sunshine Solar  ·  re-engagement thread</p></div><span class="status">ESCALATED / HUMAN REVIEW</span></div><div class="toolbar"><div class="legend" id="legend"></div><button class="raw-toggle" id="rawToggle" type="button" aria-expanded="false" aria-controls="raw-panel">View raw JSON</button></div><div id="raw-panel"><pre id="rawJson"></pre></div><div class="timeline" id="timeline" aria-live="polite"></div><footer>Source: lead_state.routingTrace + conversationHistory. This view renders the persisted state shape used by the agent graph.</footer></main>
  <script>
    const AGENTS={supervisor:{label:'SUPERVISOR',color:'var(--accent)'},qualifier:{label:'QUALIFIER',color:'var(--green)'},objectionHandler:{label:'OBJECTION HANDLER',color:'var(--violet)'},scheduler:{label:'SCHEDULER',color:'var(--blue)'},escalate:{label:'ESCALATED',color:'var(--red)'},lead:{label:'LEAD',color:'#718096'}};
    const events=[{day:1,dayLabel:'Day 1 · Aug 18',kind:'routing',to:'qualifier',reason:'3 days since last contact and qualification is incomplete. Re-engaging to gather missing info.'},{day:1,kind:'message',agent:'qualifier',role:'agent',time:'9:02 AM',text:'Hey! Just checking back in. Still exploring solar for the house? Quick one: do you own the home, and which way does the roof face?'},{day:1,kind:'message',agent:'lead',role:'lead',time:'11:40 AM',text:'yeah still interested, we own it, roof faces south'},{day:1,kind:'routing',to:'qualifier',reason:'Reply provides qualification info. Continuing the qualification flow.'},{day:1,kind:'message',agent:'qualifier',role:'agent',time:'11:41 AM',text:"Perfect, that's everything I needed. You're fully qualified. I'll get this in front of someone to find a time that works."},{day:2,dayLabel:'Day 3 · Aug 21',gap:'3 days later',kind:'message',agent:'lead',role:'lead',time:'2:15 PM',text:"actually before we go further. isn't this way more expensive than just staying on the grid?"},{day:2,kind:'routing',to:'objectionHandler',reason:'Reply raises a new objection.'},{day:2,kind:'message',agent:'objectionHandler',role:'agent',time:'2:16 PM',text:'Totally fair to ask. Most homeowners break even in 6–8 years with the 30% federal credit, then it is pure savings after. Want me to run the numbers on your actual bill?'},{day:3,dayLabel:'Day 5 · Aug 23',gap:'2 days later',kind:'message',agent:'lead',role:'lead',time:'4:50 PM',text:'idk, ask my cousin'},{day:3,kind:'escalation',to:'escalate',reason:"Reply does not match an expected pattern. Escalating for human review instead of guessing."}];
    const legend=document.getElementById('legend');['supervisor','qualifier','objectionHandler','scheduler','escalate'].forEach(key=>{const a=AGENTS[key],item=document.createElement('div');item.className='legend-item';item.innerHTML='<span class="dot" style="background:'+a.color+'"></span>'+a.label;legend.appendChild(item);});
    const timeline=document.getElementById('timeline');let lastDay=null,delay=0;events.forEach(ev=>{if(ev.day!==lastDay){lastDay=ev.day;const divider=document.createElement('div');divider.className='day-divider';divider.innerHTML='<span class="line"></span><span class="label">'+ev.dayLabel+(ev.gap?' · '+ev.gap:'')+'</span><span class="line"></span>';timeline.appendChild(divider);}const row=document.createElement('div');row.className='row';row.style.animationDelay=delay+'s';delay+=.04;const spine=document.createElement('div');spine.className='spine';const content=document.createElement('div');if(ev.kind==='routing'||ev.kind==='escalation'){const color=AGENTS[ev.to].color;spine.style.setProperty('--seg-color',color);spine.innerHTML='<div class="node" style="--seg-color:'+color+'"></div>';if(ev.kind==='escalation'){content.className='card escalated';content.innerHTML='<div class="card-head"><span class="agent-tag">ESCALATED TO HUMAN REVIEW</span></div><p>'+ev.reason+'</p><span class="review-chip">needsHumanReview: true</span>';}else{content.className='routing-line';content.innerHTML='<span class="arrow" style="--seg-color:'+color+'">SUPERVISOR → '+AGENTS[ev.to].label+'</span> · <span class="reason">“'+ev.reason+'”</span>';}}else{const agentKey=ev.role==='lead'?'lead':ev.agent,color=AGENTS[agentKey].color;spine.style.setProperty('--seg-color',color);spine.innerHTML='<div class="node" style="--seg-color:'+color+'"></div>';content.className='card'+(ev.role==='lead'?' lead':'');content.style.setProperty('--seg-color',color);content.innerHTML='<div class="card-head"><span class="agent-tag">'+AGENTS[agentKey].label+'</span><span class="timestamp">'+ev.time+'</span></div><p>'+ev.text+'</p>';}row.append(spine,content);timeline.appendChild(row);});
    document.getElementById('rawJson').textContent=JSON.stringify(events,null,2);const toggle=document.getElementById('rawToggle'),panel=document.getElementById('raw-panel');toggle.addEventListener('click',()=>{const open=panel.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Hide raw JSON':'View raw JSON';});
  </script>
